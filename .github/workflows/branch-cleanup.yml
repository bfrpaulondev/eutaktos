name: Branch cleanup

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-closed-head:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete closed feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" != "main" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_REF}" || true
          fi

  cleanup-legacy-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove known superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=(
            "feat/epic-01-pwa-foundation"
            "feat/epic-01-pwa-foundation-v2"
            "feat/epic-01-pwa-foundation-v3"
            "feat/epic-01-pwa-foundation-v4"
            "feat/epic-01-pwa-foundation-v5"
            "feat/interactive-workspaces"
            "feat/liquid-glass-design-system"
            "feat/pwa-installability-hardening"
            "chore/closed-branch-cleanup"
          )

          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            fi
          done
