name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: PX1 temporary synchronize resolved lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'principal/px1-ant-foundation'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(px1): refresh package lock for Ant Design"
          git push origin HEAD:${{ github.head_ref }}
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  browser-regression:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Browser regression
        shell: bash
        run: |
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER_BIN" ]; then
            echo "No Chromium-compatible browser is installed on the runner." >&2
            exit 1
          fi
          CHROMIUM_BIN="$BROWSER_BIN" npm run test:browser-regression --workspace @eutaktos/web-pwa
