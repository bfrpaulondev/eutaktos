name: Eutakes direct-code production smoke

on:
  pull_request:
    branches: [main]

jobs:
  production-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser-origin auth probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          "$BROWSER_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 --user-data-dir=/tmp/eutakes-browser-smoke about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:9222/json/version >/dev/null 2>&1; then break; fi
            sleep 0.1
          done
          node <<'NODE'
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const pages = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
          if (!pages.length) throw new Error('No Chrome page');
          const ws = new WebSocket(pages[0].webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            ws.addEventListener('open', resolve, { once: true });
            ws.addEventListener('error', reject, { once: true });
          });
          let id = 0;
          const pending = new Map();
          ws.addEventListener('message', event => {
            const msg = JSON.parse(event.data);
            if (!msg.id) return;
            const p = pending.get(msg.id);
            if (!p) return;
            pending.delete(msg.id);
            if (msg.error) p.reject(new Error(JSON.stringify(msg.error)));
            else p.resolve(msg.result);
          });
          function send(method, params = {}) {
            return new Promise((resolve, reject) => {
              const messageId = ++id;
              pending.set(messageId, { resolve, reject });
              ws.send(JSON.stringify({ id: messageId, method, params }));
            });
          }
          await send('Page.enable');
          await send('Runtime.enable');
          const nav = await send('Page.navigate', { url: 'https://eutakes.netlify.app/' });
          console.log('NAV=' + JSON.stringify(nav));
          await sleep(2500);
          const state = await send('Runtime.evaluate', {
            expression: '({href: location.href, ready: document.readyState, origin: location.origin, title: document.title})',
            returnByValue: true,
          });
          console.log('PAGE_STATE_RAW=' + JSON.stringify(state));
          const expression = `(async () => {
            try {
              const response = await fetch('/api/auth/verify', {
                method: 'POST',
                credentials: 'same-origin',
                headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: 'pilot-browser-smoke@example.invalid', token: '000000' })
              });
              return { ok: true, status: response.status, body: await response.text(), href: location.href };
            } catch (error) {
              return { ok: false, name: error?.name, message: String(error?.message || error), href: location.href };
            }
          })()`;
          const result = await send('Runtime.evaluate', { expression, awaitPromise: true, returnByValue: true });
          console.log('AUTH_RAW=' + JSON.stringify(result));
          const value = result?.result?.value;
          console.log('BROWSER_AUTH_RESULT=' + JSON.stringify(value));
          if (!value || typeof value.ok !== 'boolean') process.exit(2);
          if (value.ok && ![401, 403, 503].includes(value.status)) process.exit(3);
          if (!value.ok) process.exit(4);
          ws.close();
          NODE
