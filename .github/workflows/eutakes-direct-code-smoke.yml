name: Eutakes direct-code production smoke

on:
  pull_request:
    branches: [main]

jobs:
  production-ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser-origin auth probe
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          CHROMIUM_BIN="$BROWSER_BIN" node <<'NODE'
          const { spawn } = await import('node:child_process');
          const appUrl = 'https://eutakes.netlify.app/';
          const debugPort = '9231';
          const debugUrl = `http://127.0.0.1:${debugPort}`;
          const chromium = process.env.CHROMIUM_BIN;
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function poll(operation, label, attempts = 80) {
            let lastError;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
              try {
                const value = await operation();
                if (value) return value;
              } catch (error) { lastError = error; }
              await wait(150);
            }
            throw new Error(`${label}: ${String(lastError ?? 'timed out')}`);
          }

          function connectCdp(url) {
            const socket = new WebSocket(url);
            const pending = new Map();
            let nextId = 1;
            socket.addEventListener('message', event => {
              const message = JSON.parse(String(event.data));
              const resolver = pending.get(message.id);
              if (!resolver) return;
              pending.delete(message.id);
              resolver(message);
            });
            return new Promise((resolve, reject) => {
              socket.addEventListener('open', () => resolve({
                send(method, params = {}) {
                  const id = nextId++;
                  socket.send(JSON.stringify({ id, method, params }));
                  return new Promise((done, fail) => {
                    pending.set(id, response => response.error ? fail(new Error(response.error.message)) : done(response.result));
                  });
                },
                close() { socket.close(); },
              }));
              socket.addEventListener('error', reject, { once: true });
            });
          }

          let stderr = '';
          const browser = spawn(chromium, [
            '--headless=new', '--no-sandbox', '--disable-gpu',
            `--remote-debugging-port=${debugPort}`,
            `--user-data-dir=/tmp/eutakes-browser-smoke-${process.pid}`,
            appUrl,
          ], { stdio: ['ignore', 'ignore', 'pipe'] });
          browser.stderr.on('data', chunk => { stderr += String(chunk); });
          let cdp;
          try {
            const target = await poll(async () => {
              const targets = await (await fetch(`${debugUrl}/json`)).json();
              return targets.find(item => item.type === 'page' && item.url.startsWith(appUrl));
            }, 'Chromium did not open Eutakes');
            cdp = await connectCdp(target.webSocketDebuggerUrl);
            await cdp.send('Runtime.enable');
            await cdp.send('Page.enable');

            await poll(async () => {
              const state = await cdp.send('Runtime.evaluate', {
                expression: `document.readyState === 'complete' && location.origin === 'https://eutakes.netlify.app'`,
                returnByValue: true,
              });
              return state.result.value === true;
            }, 'Eutakes page did not become ready');

            const pageState = await cdp.send('Runtime.evaluate', {
              expression: `({href: location.href, ready: document.readyState, body: document.body.innerText.slice(0, 500)})`,
              returnByValue: true,
            });
            console.log('PAGE_STATE=' + JSON.stringify(pageState.result.value));

            const auth = await cdp.send('Runtime.evaluate', {
              expression: `(async () => {
                try {
                  const response = await fetch('/api/auth/verify', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: 'pilot-browser-smoke@example.invalid', token: '000000' })
                  });
                  return { ok: true, status: response.status, body: await response.text() };
                } catch (error) {
                  return { ok: false, name: error?.name, message: String(error?.message || error) };
                }
              })()`,
              awaitPromise: true,
              returnByValue: true,
            });
            if (auth.exceptionDetails) throw new Error(auth.exceptionDetails.exception?.description ?? auth.exceptionDetails.text);
            const value = auth.result.value;
            console.log('BROWSER_AUTH_RESULT=' + JSON.stringify(value));
            if (!value?.ok) throw new Error(`Browser fetch failed: ${JSON.stringify(value)}`);
            if (![401, 403, 503].includes(value.status)) throw new Error(`Unexpected auth status ${value.status}`);
          } catch (error) {
            console.error(String(error));
            if (stderr) console.error('CHROME_STDERR=' + stderr.slice(-4000));
            process.exitCode = 1;
          } finally {
            cdp?.close();
            if (!browser.killed) browser.kill('SIGTERM');
          }
          NODE
