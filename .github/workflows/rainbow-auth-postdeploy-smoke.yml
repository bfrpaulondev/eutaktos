name: Rainbow auth post-deploy smoke

on:
  pull_request:
    paths:
      - '.github/workflows/rainbow-auth-postdeploy-smoke.yml'

permissions:
  contents: read

jobs:
  deployment-capability:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
      NETLIFY_DEPLOY_HOOK: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
    steps:
      - name: Report only credential availability
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "$2" ]; then echo "$1=present"; else echo "$1=absent"; fi; }
          present NETLIFY_AUTH_TOKEN "$NETLIFY_AUTH_TOKEN"
          present NETLIFY_SITE_ID "$NETLIFY_SITE_ID"
          present NETLIFY_BUILD_HOOK "$NETLIFY_BUILD_HOOK"
          present NETLIFY_DEPLOY_HOOK "$NETLIFY_DEPLOY_HOOK"

  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify canonical production runtime and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://rainbow-zuccutto-00d981.netlify.app'

          root_code="$(curl --silent --show-error --location --output /tmp/root.html --write-out '%{http_code}' "$BASE/")"
          echo "root=$root_code"
          test "$root_code" = '200'

          health_code="$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$BASE/api/health")"
          echo "health=$health_code body=$(cat /tmp/health.json)"
          test "$health_code" = '200'
          node -e "const x=require('/tmp/health.json'); if(x.status!=='ok') process.exit(1)"

          ready_code="$(curl --silent --show-error --output /tmp/ready.json --write-out '%{http_code}' "$BASE/api/ready")"
          echo "ready=$ready_code body=$(cat /tmp/ready.json)"
          test "$ready_code" = '200'
          node -e "const x=require('/tmp/ready.json'); if(x.status!=='ready'||x.database!=='reachable') process.exit(1)"

          session_code="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' "$BASE/api/session")"
          echo "session=$session_code body=$(cat /tmp/session.json)"
          test "$session_code" = '401'

          otp_code="$(curl --silent --show-error --request POST --header 'Content-Type: application/json' --data '{}' --output /tmp/otp.json --write-out '%{http_code}' "$BASE/api/auth/otp")"
          echo "auth-otp=$otp_code body=$(cat /tmp/otp.json)"
          test "$otp_code" = '403'

          echo 'HTTP smoke passed.'

      - name: Verify signed-out browser sees login gate
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_BIN"
          HTML="$($BROWSER_BIN --headless=new --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom 'https://rainbow-zuccutto-00d981.netlify.app/' 2>/dev/null)"
          printf '%s' "$HTML" > /tmp/rendered.html
          grep -Eq 'Entrar no Eutaktos|Sign in to Eutaktos|Entrar en Eutaktos' /tmp/rendered.html
          grep -Eq 'type="email"|inputmode="email"' /tmp/rendered.html
          if grep -q 'Navegação principal' /tmp/rendered.html; then
            echo 'Authenticated application shell unexpectedly visible without a session.' >&2
            exit 1
          fi
          echo 'Browser smoke passed: signed-out production renders the login gate.'
