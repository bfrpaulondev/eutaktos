name: Feature proposal
description: Propose a product or engineering capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy/security implications
      description: Describe new data, permissions, third parties or sensitive workflows.
