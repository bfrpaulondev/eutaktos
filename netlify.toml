[build]
command = "npm --workspace @eutaktos/web-pwa run build"
publish = "apps/web-pwa/dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[redirects]]
from = "/api"
to = "/.netlify/functions/api"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

# Keep this fallback after the API rewrites so browser deep links load the SPA
# without swallowing /api/* requests into index.html.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
